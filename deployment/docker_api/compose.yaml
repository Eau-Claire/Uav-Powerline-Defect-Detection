services:
  detector-api:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      MODEL_PATH: /models/baseline_v5_seed42_best.pt
      DEVICE: cpu
      IMGSZ: "640"
      CONFIDENCE: "0.10"
      DETECT_API_TOKEN: ${DETECT_API_TOKEN:?Set DETECT_API_TOKEN in .env}
    volumes:
      - ../modal/models/baseline_v5_seed42_best.pt:/models/baseline_v5_seed42_best.pt:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          memory: 6G
