[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov11sdi"
version = "0.1.0"
description = "UAV power-line defect detection research pipeline (V6.2E -> V6.5), local-first and resumable"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
# Data staging (OpenImages / MPCD / PowerEquipment / pHash / GrabCut).
stage = [
    "imagehash>=4.3",
    "opencv-python-headless>=4.8",
    "fiftyone==1.22.1",
    "gdown>=5",
    "huggingface_hub>=0.23",
    "tqdm",
]
# GPU training. Pinned to the version used by the Kaggle/Camber workers.
train = ["ultralytics==8.4.172"]
notebook = ["jupyterlab>=4", "ipykernel", "matplotlib"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
